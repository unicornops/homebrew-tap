name: Update Shuffleboard

# Keeps Casks/shuffleboard.rb on the latest Shuffleboard release. Runs daily, by hand, or when sent a
# `shuffleboard-release` repository_dispatch. Needs only this repository's GITHUB_TOKEN.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [shuffleboard-release]

permissions:
  contents: write

concurrency:
  group: update-shuffleboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update cask from the latest release
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(python3 scripts/update-shuffleboard.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- Casks/shuffleboard.rb; then
            echo "Cask already at $version"
          else
            git diff -- Casks/shuffleboard.rb
          fi

      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet -- Casks/shuffleboard.rb; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/shuffleboard.rb
          git commit -m "shuffleboard ${{ steps.update.outputs.version }}"
          git push
